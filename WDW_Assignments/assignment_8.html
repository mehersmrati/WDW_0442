<!DOCTYPE html>
<html>
<head>
    <title>Links and Images</title>
</head>
<body>
    <h3 id="top">Links demo</h3>

    <!-- External link -->
    <p><a href="https://www.google.com" target="_blank">External link</a></p>

    <!-- Internal page link -->
    <p><a href="#bottom">Jump to bottom</a></p>

    <!-- Email link -->
    <p><a href="mailto:student@example.com">Email us</a></p>

    <!-- Image with attributes: save logo.png in the same folder -->
    <p>Logo</p>
    <img src="logo.png" alt="College Logo" width="100" height="100">

    <div style="margin-top: 250px;" id="bottom">
        Bottom. <a href="#top">Back to top</a>
    </div>
</body>
</html>
