<!DOCTYPE html>
<html>
<head>
    <title>ABC College Admission 2026</title>
    
</head>
<body>
        <h1>ABC College Admission 2026</h1>
            <h2>Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>₹90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>₹45,000</td>
                    </tr>
            </table>
            <form action="#" method="post">

                    <label for="student-name">Name:</label><br>
                    <input type="text" id="student-name" name="name" required>
                    <br>

                    <label for="student-email">Email:</label><br>
                    <input type="email" id="student-email" name="email" required>
                    <br>

                    <label for="course">Course:</label><br>
                    <select id="course" name="course">
                        <option>B.Tech CSE</option>
                        <option>BCA</option>
                    </select>
                    <br>

                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4"></textarea>
                    <br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>
    <p>&copy; 2026 ABC College</p>
</body>
</html>
